name: Refresh FormaX Football Data

on:
  workflow_dispatch:

  schedule:
    - cron: "30 4 * * 1"
      timezone: "Europe/Istanbul"

permissions:
  contents: write

concurrency:
  group: formax-data-refresh
  cancel-in-progress: false

jobs:
  refresh-data:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download latest football dataset
        run: node scripts/download-open-data.js

      - name: Export FormaX web data
        run: npm run web:export

      - name: Merge current season statistics
        run: npm run data:current-stats

      - name: Rebuild progressive chunks
        run: npm run data:chunks

      - name: Run tests
        run: npm run test:web

      - name: Run lint
        run: npm run lint

      - name: Check generated changes
        id: changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit refreshed data
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "FormaX Data Bot"
          git config user.email "formax-data-bot@users.noreply.github.com"

          git add data scripts/download-open-data.js scripts/refresh-current-player-stats.js

          git commit -m "data: refresh FormaX football dataset"

          git push
