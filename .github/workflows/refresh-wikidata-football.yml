name: Refresh authoritative Wikidata football data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Refresh active or all cached players"
        required: false
        default: "active"

  schedule:
    - cron: "27 3 * * 3"

permissions:
  contents: write

concurrency:
  group: wikidata-football-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore build database
        run: node scripts/unpack-master-player-data.js

      - name: Discover new Transfermarkt player IDs
        env:
          WIKIDATA_NEW_PAGE_SIZE: "500"
          WIKIDATA_API_DELAY_MS: "800"
        run: node scripts/discover-new-wikidata-players.js

      - name: Enrich newly discovered players
        env:
          WIKIDATA_ENTITY_BATCH: "50"
          WIKIDATA_API_DELAY_MS: "600"
        run: node scripts/wikidata-enrich-new-players.js

      - name: Refresh active cached players
        env:
          WIKIDATA_REFRESH_MODE: ${{ github.event.inputs.mode || 'active' }}
          WIKIDATA_ENTITY_BATCH: "50"
          WIKIDATA_API_DELAY_MS: "600"
        run: node scripts/wikidata-periodic-refresh.js

      - run: node scripts/merge-wikidata-football-data.js
      - run: node scripts/deduplicate-wikidata-team-statistics.js
      - run: node scripts/sanitize-wikidata-statistics.js
      - run: node scripts/filter-target-league-players.js
      - run: node scripts/fix-null-player-names.js
      - run: node scripts/finalize-wikidata-web-data.js
      - run: node scripts/normalize-player-dataset.js
      - run: node scripts/enrich-career-statistics.js
      - run: node scripts/enrich-popularity.js
      - run: npm run data:chunks
      - run: node scripts/build-game-indexes.js
      - run: node scripts/validate-deploy-data.js
      - run: npm run test:web
      - run: npm run lint

      - name: Repack build database
        run: node scripts/pack-master-player-data.js

      - name: Remove unpublishable build artifact
        run: rm -f data/web-data.json

      - name: Commit refreshed datasets
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/master-player-data.json.gz
          git add data/player-stat-overrides.json
          git add data/wikidata-football-cache.json.gz
          git add data/career-bootstrap.json
          git add data/career-manifest.json
          git add data/fc26-bootstrap.json
          git add data/fc26-manifest.json
          git add data/chunks
          git add data/game-index
          git add data/players-current.txt
          git add data/players-needs-review.txt

          git commit -m "data: refresh optimized football datasets"
          git push